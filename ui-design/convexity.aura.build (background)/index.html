--gold-faint: rgba(169, 196, 220, .28);
--dim-2: #8ea6bf;
--line: rgba(226, 232, 244, .30);
--pad: 28.5px;
--btn: 51px;
--serif: "Instrument Serif", Georgia, "Times New Roman", serif;
--sans: Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif
}
* {
box-sizing: border-box;
margin: 0;
padding: 0
}
body,
html {
height: 100%
}
.rings,
body {
color: var(--ink)
}
body {
background: #000;
font-family: var(--sans);
overflow: hidden;
-webkit-font-smoothing: antialiased;
text-rendering: optimizeLegibility
}
body[data-cursor=close],
body[data-cursor=hot],
button.rings {
cursor: pointer
}
#frame,
canvas#sky {
position: fixed;
inset: 0;
z-index: 0
}
#frame {
z-index: 40;
pointer-events: none
}
#frame svg,
canvas#sky {
width: 100%;
height: 100%;
display: block
}
#frame .fc {
position: absolute;
top: 0;
right: 0;
width: clamp(72px, 6.4vw, 92px);
height: auto;
display: block
}
#frame .fc.tl {
right: auto;
left: 0;
transform: scaleX(-1)
}
#frame .fc.br {
top: auto;
bottom: 0;
transform: scaleY(-1)
}
#frame .fc.bl {
top: auto;
bottom: 0;
right: auto;
left: 0;
transform: scale(-1, -1)
}
.rings {
position: relative;
width: var(--btn);
height: var(--btn);
border-radius: 999px;
border: 1px solid var(--gold-dim);
background: 0 0;
display: grid;
place-items: center;
transition: border-color .45s ease, transform .45s cubic-bezier(.2, .7, .2, 1), opacity .5s ease
}
.rings::before {
content: "";
position: absolute;
inset: 5.5px;
border-radius: 999px;
border: 1px dotted rgba(232, 236, 244, .42);
transition: opacity .45s ease, transform .8s cubic-bezier(.2, .7, .2, 1)
}
.rings:hover {
border-color: var(--gold)
}
.rings:hover::before {
transform: rotate(120deg)
}
button.rings {
padding: 0;
font: inherit
}
.ui {
position: fixed;
z-index: 45
}
#sound {
left: 34.5px;
bottom: 27.5px
}
#closeBtn,
#menuBtn {
right: var(--pad);
top: var(--pad)
}
#closeBtn {
opacity: 0;
pointer-events: none
}
#closeBtn.on {
opacity: 1;
pointer-events: auto;
transform: none
}
#closeBtn,
#menuBtn.off {
transform: scale(.7)
}
#menuBtn.off,
body.phase-crest #menuBtn,
body.phase-crest #rail,
body.phase-hero #actions,
body.phase-hero #menuBtn,
body.phase-hero #rail,
body.phase-loading #actions,
body.phase-loading #menuBtn,
body.phase-loading #rail {
opacity: 0;
pointer-events: none
}
#actions,
#menuBtn {
transition: opacity .7s ease
}
.bars {
width: 22px;
height: 12px;
position: relative
}
.bars i {
position: absolute;
height: 1.5px;
background: var(--ink);
border-radius: 1px;
transition: width .4s ease, transform .4s ease
}
.bars i:nth-child(1) {
top: 2px;
left: 0;
width: 22px
}
.bars i:nth-child(2) {
bottom: 2px;
right: 0;
width: 16px
}
.bars b {
position: absolute;
bottom: 1.2px;
left: -1px;
width: 3.5px;
height: 3.5px;
border-radius: 9px;
background: var(--gold)
}
#actions,
#shareWrap {
display: flex;
align-items: center
}
#actions {
right: 64px;
bottom: 27.5px;
gap: 16.5px
}
#shareWrap {
position: relative;
height: var(--btn);
justify-content: flex-end
}
#shareToggle {
flex: 0 0 auto
}
#join::before,
#shareRow {
position: absolute;
border-radius: 999px
}
#shareRow {
right: 0;
top: 0;
height: var(--btn);
display: flex;
align-items: center;
gap: 0;
border: 1px solid var(--gold-dim);
background: rgba(0, 0, 0, .55);
backdrop-filter: blur(2px);
width: var(--btn);
overflow: hidden;
opacity: 0;
pointer-events: none;
transition: width .55s cubic-bezier(.2, .75, .2, 1), opacity .35s ease
}
#shareRow.on {
width: 204px;
opacity: 1;
pointer-events: auto
}
#shareRow a,
#shareRow button {
flex: 1 0 auto;
display: grid;
place-items: center;
height: 100%;
width: 40.8px;
color: var(--ink);
opacity: .9;
background: 0 0;
border: 0;
cursor: pointer;
transition: opacity .3s ease, transform .3s ease
}
#shareRow a:hover,
#shareRow button:hover {
opacity: 1;
transform: translateY(-1px)
}
#shareRow svg {
width: 15px;
height: 15px;
fill: currentColor
}
#shareToggle svg {
width: 16px;
height: 16px;
fill: var(--ink)
}
#hint s,
#join {
text-decoration: none
}
#join {
width: 165px;
height: var(--btn);
border-radius: 999px;
border: 1px solid var(--gold-dim);
display: grid;
place-items: center;
color: var(--ink);
background: 0 0;
cursor: pointer;
font-family: var(--sans);
font-weight: 400;
font-size: 13px;
letter-spacing: .14em;
position: relative;
transition: border-color .45s ease, letter-spacing .5s ease, box-shadow .65s cubic-bezier(.2, .7, .2, 1)
}
#enter,
#join,
#pMore {
isolation: isolate
}
#rail svg,
.bglow {
width: 100%;
height: 100%
}
.bglow {
position: absolute;
inset: 0;
border-radius: inherit;
pointer-events: none;
z-index: -1;
display: block
}
#enter.lit,
#join.lit,
#pMore.lit {
box-shadow: 0 0 28px 2px rgba(96, 150, 255, .42), 0 0 9px rgba(130, 180, 255, .45);
border-color: rgba(160, 200, 255, .75)
}
#join::before {
content: "";
inset: 5.5px;
border: 1px dotted rgba(232, 236, 244, .42);
transition: transform .9s cubic-bezier(.2, .7, .2, 1)
}
#join:hover {
border-color: var(--gold);
letter-spacing: .2em
}
#join:hover::before {
transform: scale(1.012)
}
#hint {
left: 50%;
top: 45px;
transform: translateX(-50%);
font-family: var(--serif);
font-weight: 400;
font-size: 15px;
letter-spacing: .11em;
color: rgba(244, 247, 252, .98);
white-space: nowrap;
display: flex;
align-items: center;
gap: 11px;
transition: opacity .6s ease
}
#hint s {
width: 4.5px;
height: 4.5px;
border-radius: 9px;
background: var(--gold);
display: block
}
#hint.off {
opacity: 0
}
#rail {
position: fixed;
transition: opacity .45s ease;
left: 32.75px;
top: 50%;
transform: translateY(-50%);
width: 54.5px;
height: 216px;
z-index: 44;
pointer-events: none
}
#rail svg {
overflow: visible
}
#railSym {
position: absolute;
left: 50%;
top: 50%;
height: 42px;
width: auto;
transform: translate(-50%, -50%);
opacity: 0;
transition: opacity .5s ease
}
#cur.hot .dot svg,
body.sign-on #railSym {
opacity: 1
}
#menu,
#panel {
position: fixed;
opacity: 0;
pointer-events: none
}
#panel {
z-index: 46;
left: 120px;
top: 50%;
transform: translateY(-46%);
width: 440px
}
#panel.on {
pointer-events: auto
}
#loading p,
#panel h1 {
font-family: var(--serif)
}
#panel h1 {
font-size: clamp(56px, 5.6vw, 80px);
line-height: .96;
letter-spacing: -.006em;
text-transform: uppercase;
margin: 0
}
#panel h1 .l1 {
display: block;
padding-left: 0
}
#panel h1,
#panel h1 .l2 {
font-weight: 400;
color: #fff
}
#panel h1 .l2 {
display: block;
font-family: var(--serif);
font-size: clamp(24px, 2.3vw, 32px);
line-height: 1.15;
letter-spacing: 0;
text-transform: none;
margin-top: 8px
}
#panel .body {
margin: 24px 0 0;
font-family: var(--sans);
font-weight: 400;
font-size: 16px;
line-height: 1.5;
color: rgba(240, 244, 250, .94);
max-width: 340px
}
#hero .sub em,
#panel .body em,
#panel h1 .l2 {
font-style: italic
}
#panel .body a {
color: inherit;
text-decoration: underline;
text-underline-offset: 3px;
text-decoration-thickness: .5px;
cursor: pointer
}
#menuInner li,
#panel .motto {
display: flex;
align-items: center;
font-weight: 400
}
#panel .motto {
margin: 26px 0 0;
gap: 16px;
font-family: var(--sans);
font-size: 12px;
letter-spacing: .14em;
color: var(--gold);
text-transform: uppercase
}
#panel .motto .glyph {
display: none;
flex: 0 0 auto;
height: 42px;
width: auto
}
#panel .fade {
opacity: 0;
transform: translateY(14px);
transition: opacity .8s ease, transform .9s cubic-bezier(.2, .7, .2, 1)
}
#panel.on .fade {
opacity: 1;
transform: none
}
#panel.on h1 .l1 {
transition-delay: .05s
}
#panel.on h1 .l2 {
transition-delay: .12s
}
#panel.on .body {
transition-delay: .2s
}
#panel.on .motto {
transition-delay: .28s
}
#menu {
inset: 0;
z-index: 44;
transition: opacity .6s ease
}
#menu.on {
opacity: 1;
pointer-events: auto
}
#menuList {
position: absolute;
left: 0;
top: 0;
width: min(64%, 760px);
height: 100%;
overflow: hidden
}
#menuInner {
left: 161px;
top: 50%;
width: 100%;
will-change: transform
}
#menuInner li {
list-style: none;
left: 0;
top: 0;
height: 58px;
margin-top: -29px;
font-family: var(--serif);
font-size: 42px;
letter-spacing: .004em;
color: #fff;
white-space: nowrap;
transform-origin: left center;
will-change: transform, opacity
}
#menuInner li .txt {
position: relative;
cursor: pointer
}
#menuInner li .st {
margin-left: 14px;
font-size: 17px;
color: rgba(232, 236, 244, .85);
transform: translateY(-5px)
}
#mark,
#menuInner,
#menuInner li,
#motto {
position: absolute
}
#mark {
left: 91.5px;
top: 50%;
width: 47px;
height: 1px;
background: var(--gold);
transform: translateY(-.5px) scaleX(.2);
transform-origin: left center;
transition: opacity .5s ease, transform .6s cubic-bezier(.2, .7, .2, 1)
}
#mark,
#menu.on~#rail,
#rail.hide {
opacity: 0
}
#menu.on #mark {
opacity: 1;
transform: translateY(-.5px) scaleX(1)
}
#motto {
right: 140px;
bottom: 88px;
font-family: var(--sans);
font-weight: 400;
font-size: 15px;
color: rgba(240, 244, 250, .94);
letter-spacing: .01em;
transition: opacity .45s ease
}
#intro {
position: fixed;
inset: 0;
z-index: 60;
pointer-events: none
}
#hero,
#intro,
#loading {
display: grid;
place-items: center
}
#loading {
position: absolute;
gap: 22px;
transition: opacity .7s ease
}
#loading .hexspin {
width: 66px;
height: 66px;
animation: spin 18s linear infinite
}
#loading p {
font-size: 19px;
letter-spacing: .06em;
color: rgba(232, 236, 244, .72)
}
#hero {
opacity: 0;
transition: opacity 1.1s ease
}
#hero,
#hero .wrap {
position: absolute;
inset: 0
}
#hero .dial svg,
#hero .orb svg,
#hero h1 {
position: absolute;
left: 50%;
transform: translate(-50%, -50%)
}
#hero h1 {
top: 49.5%;
font-weight: 400;
font-size: clamp(35px, 4.79vw, 60px);
line-height: 1.3;
color: #fff;
letter-spacing: -.004em;
text-align: center;
white-space: nowrap
}
#hero h1 .a,
#hero h1 .b {
font-family: var(--serif);
display: block
}
#hero h1 .b {
font-family: var(--sans);
font-weight: 400;
margin-top: 1px;
font-size: .98em
}
#hero .dial,
#hero .orb {
position: relative;
display: inline-block
}
#hero .dial svg,
#hero .orb svg {
top: 50%;
width: 1.05em;
height: 1.05em;
overflow: visible
}
#hero .dial svg {
left: 56%;
top: 64%;
width: 1.18em;
height: 1.18em
}
#dcompat span,
#hero .sub {
color: rgba(240, 244, 250, .92)
}
#enter,
#hero .sub {
font-family: var(--sans);
font-weight: 400
}
#hero .sub {
position: absolute;
left: 63.5%;
top: 59.3%;
font-size: clamp(12px, 1.28vw, 16px);
line-height: 1.62;
text-align: center
}
#hero .curve {
position: absolute;
left: 42.5%;
top: 40.9%;
width: 23.7%;
height: 25%;
overflow: visible
}
#hero .curve,
#hero .dial svg,
#hero .orb svg {
display: none
}
#enter {
left: 50%;
top: 71.4%;
transform: translateX(-50%);
width: 168px;
height: 44px;
border-radius: 999px;
border: 1px solid var(--gold-dim);
background: 0 0;
color: var(--ink);
font-size: 12px;
letter-spacing: .16em;
position: relative;
cursor: pointer;
pointer-events: auto;
transition: border-color .4s ease, letter-spacing .5s ease, box-shadow .65s cubic-bezier(.2, .7, .2, 1)
}
#enter::before,
#pMore::before {
content: "";
inset: 4.5px;
border: 1px dotted rgba(232, 236, 244, .4)
}
#enter:hover {
border-color: var(--gold);
letter-spacing: .22em
}
#crestWrap,
#cur {
pointer-events: none
}
#crestWrap {
position: absolute;
inset: 0;
display: grid;
place-items: center;
opacity: 0
}
#crestWrap svg {
width: min(300px, 38vw);
height: auto;
filter: drop-shadow(0 0 30px rgba(169, 196, 220, .14))
}
#cur {
display: none;
position: fixed;
left: 0;
top: 0;
z-index: 90;
width: 44px;
height: 44px;
margin: -22px 0 0-22px;
will-change: transform
}
#cur .dot,
#cur .ring::after,
#enter::before,
#pMore::before {
position: absolute;
border-radius: 999px
}
#cur .dot {
inset: 0;
display: grid;
place-items: center;
transform: scale(.16);
background: var(--gold);
transition: transform .38s cubic-bezier(.2, .75, .2, 1), background .35s ease
}
#cur .dot svg {
width: 17px;
height: 17px;
fill: #000;
opacity: 0;
transition: opacity .3s ease
}
#cur .gl,
#cur .ring {
position: absolute;
inset: 0
}
#cur .ring {
border-radius: 999px;
border: 1px solid var(--gold-dim);
opacity: 0;
transform: scale(.6);
transition: opacity .35s ease, transform .4s cubic-bezier(.2, .75, .2, 1)
}
#cur .ring::after {
content: "";
inset: 4px;
border: 1px dotted rgba(232, 236, 244, .4)
}
#cur .gl {
display: grid;
place-items: center;
transition: opacity .3s ease;
color: var(--ink)
}
#cur .gl svg {
width: 13px;
height: 13px
}
#cur.hot .dot {
transform: scale(.52)
}
#cur.close .dot {
transform: scale(0)
}
#cur.close .ring {
opacity: 1;
transform: none;
border-color: var(--gold)
}
#cur.close .gl {
opacity: 1
}
#cur .gl,
#cur.hidden,
body.introdark #sky {
opacity: 0
}
@media (pointer:coarse) {
#cur {
display: none
}
}
#pMore {
margin: 30px 0 0;
width: 150px;
height: 42px;
border-radius: 999px;
border: 1px solid var(--gold-dim);
background: 0 0;
color: var(--ink);
font-family: var(--sans);
font-weight: 400;
font-size: 11.5px;
letter-spacing: .2em;
position: relative;
cursor: pointer;
transition: border-color .4s ease, letter-spacing .5s ease, box-shadow .65s cubic-bezier(.2, .7, .2, 1)
}
#pMore:hover {
border-color: var(--gold);
letter-spacing: .26em
}
#panel.on #pMore {
transition-delay: .36s
}
#sky {
transition: transform 1.1s cubic-bezier(.18, .82, .2, 1), opacity 1.6s ease;
transform-origin: 50% 50%
}
#introgl {
position: fixed;
inset: 0;
width: 100%;
height: 100%;
display: block;
z-index: 1;
pointer-events: none;
transition: opacity .9s ease
}
#introgl.off {
opacity: 0
}
body.reading #sky {
transform: scale(.94)
}
#detail,
#dim {
position: fixed;
inset: 0;
background: #000;
opacity: 0
}
#dim {
z-index: 62;
pointer-events: none;
transition: opacity 1.1s cubic-bezier(.18, .82, .2, 1)
}
body.reading #dim {
opacity: .58
}
#detail {
z-index: 70;
color: var(--ink);
transition: opacity .45s ease;
visibility: hidden;
will-change: opacity
}
#detail.open {
opacity: 1
}
#detail.closing,
#detail.open {
visibility: visible
}
#detail.leaving .rv {
opacity: 0;
transition: opacity .6s ease
}
#dfix {
overflow: hidden
}
#dcon,
#dfix,
#dghost,
#dstars {
position: absolute;
inset: 0
}
#dcon,
#dstars {
width: 100%;
height: 100%;
display: block
}
#dghost {
pointer-events: none
}
#dcompat,
#dghost .ghost {
position: absolute;
left: 0;
top: 0
}
#dghost .ghost {
font-family: var(--serif);
font-size: min(22vw, 300px);
line-height: 1;
letter-spacing: .04em;
color: rgba(200, 214, 240, .05);
white-space: nowrap;
will-change: transform;
transition: opacity .6s ease
}
#dcompat {
pointer-events: none;
opacity: 0;
transition: opacity .35s ease;
text-align: center;
width: 300px;
transform: translate(-50%, -100%)
}
#dcompat b {
display: block;
font: 400 11px/1 var(--sans);
letter-spacing: .22em;
color: var(--dacc, var(--gold))
}
#dcompat span {
display: block;
margin-top: 9px;
font: 400 14px/1.45 var(--sans)
}
#dcompat.on,
.zcard .zc.on .zc-holo {
opacity: 1
}
#dscroll {
position: absolute;
inset: 0;
overflow-y: auto;
overflow-x: hidden;
scrollbar-width: none;
outline: 0
}
#dscroll::-webkit-scrollbar {
display: none
}
#dscroll[data-cursor=hot] {
cursor: pointer
}
#dpage {
position: relative;
transition: opacity .42s ease
}
#dpage.swap,
.zcard .zc.on .zc-img {
opacity: 0
}
#dclose {
position: absolute;
right: var(--pad);
top: var(--pad);
z-index: 5;
transition: opacity .5s ease .9s
}
#detail:not(.open) #dclose {
opacity: 0;
transition-delay: 0s
}
.dhero {
position: relative;
min-height: 100vh;
display: flex;
flex-direction: column;
justify-content: center;
padding: 0 12vw
}
.dglyph {
font-family: "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols 2", "Noto Sans Symbols", var(--serif);
color: var(--dacc, var(--gold))
}
.dhero .dglyph {
font-size: 24px;
line-height: 1;
letter-spacing: .3em
}
.dsep,
.zsym {
display: block
}
.zsym {
height: 76px;
width: auto
}
.dhero .dglyph .zsym {
height: clamp(64px, 8vw, 96px)
}
.dsep {
--sepw: clamp(220px, 28vw, 400px);
width: var(--sepw);
height: auto;
aspect-ratio: 551/130;
margin: 0 0 0 calc(12vw + (660px - 12vw - var(--sepw))/2)
}
.dbox {
position: relative;
margin: 0-64px;
padding: 54px 64px 58px;
background: rgba(1, 3, 7, .46)
}
.dbox>:last-child {
margin-bottom: 0
}
.dbox .bc {
position: absolute;
top: -12px;
right: -12px;
width: 66px;
height: auto;
display: block;
pointer-events: none
}
.dbox .bc.tl {
right: auto;
left: -12px;
transform: scaleX(-1)
}
.dbox .bc.br {
top: auto;
bottom: -12px;
transform: scaleY(-1)
}
.dbox .bc.bl {
top: auto;
bottom: -12px;
right: auto;
left: -12px;
transform: scale(-1, -1)
}
.dname,
.dtag {
font-family: var(--serif)
}
.dname {
font-weight: 400;
font-size: clamp(84px, 14vw, 196px);
line-height: .92;
letter-spacing: .05em;
text-transform: uppercase;
color: #fff;
margin: 16px 0 20px
}
.dtag {
font-style: italic;
font-size: clamp(26px, 3.2vw, 44px);
line-height: 1.1;
color: rgba(240, 244, 250, .92)
}
.dmeta,
.traits li::before {
color: var(--dacc, var(--gold))
}
.dmeta {
margin-top: 28px;
font: 400 12px/1 var(--sans);
letter-spacing: .28em;
text-transform: uppercase
}
.dhint,
.dsec .eyebrow {
font: 400 11px/1 var(--sans)
}
.dhint {
position: absolute;
left: 12vw;
bottom: 40px;
letter-spacing: .24em;
text-transform: uppercase;
color: rgba(240, 244, 250, .5)
}
.dsec {
padding: 20vh 12vw 12vh;
max-width: calc(12vw + 660px)
}
.dsec .eyebrow {
letter-spacing: .28em;
color: var(--dacc, var(--gold));
margin-bottom: 34px;
display: flex;
align-items: center;
gap: 16px

<script>
    const e=e=>{const t=document.querySelector(`#assetmap img[data-k="${e.replace(/[^a-z0-9]+/gi,'_')}"]`);return t&&t.getAttribute('src')||e};function t(e){return function(){e=1831565813+(e|=0)|0;let t=Math.imul(e^e>>>15,1|e);return t=t+Math.imul(t^t>>>7,61|t)^t,((t^t>>>14)>>>0)/4294967296}}const a=(e,t,a)=>e<t?t:e>a?a:e,n=(e,t,a)=>e+(t-e)*a,o=e=>e*e*(3-2*e),s=e=>1-Math.pow(1-e,3),r=2*Math.PI,i=[{key:'aries',l1:'Aries',l2:'The Ram',tag:'The Pioneer.',short:'A spark becomes a path when you move with heart. Courage turns the unknown into something beautiful.',glyph:'♈︎',dates:'Mar 21 – Apr 19',element:'Fire',ruler:'Mars',fig:'aries',body:'Mars hands you the match this week and asks only that you strike it somewhere useful. A plan you shelved in spring is suddenly the obvious move; say yes before the doubt catches up. Watch the temper on Thursday—the person across the table is not the obstacle, the timing is. Rest is not surrender. Take the win, then take the night off.',motto:'Fortune favours the first to move.'},{key:'taurus',l1:'Taurus',l2:'The Bull',tag:'The Grounded.',short:'Beauty lives in the details. Patience turns dreams into a lasting home.',glyph:'♉︎',
dates:'Apr 20 – May 20',element:'Earth',ruler:'Venus',fig:'taurus',body:'Venus slows the clock, and for once the slowness is on your side. Something you have been building quietly is ready to be shown, and the right person is already looking. Money asks for a decision midweek; choose the option you can still love in a year. Comfort is your gift, not your excuse. Set the table and let them come to you.',motto:'Slow is smooth; smooth is fast.'},{key:'gemini',l1:'Gemini',l2:'The Twins',tag:'The Explorer.',short:'Two worlds, one curious mind. You find magic in every conversation.',glyph:'♊︎',dates:'May 21 – Jun 20',element:'Air',ruler:'Mercury',fig:'gemini',body:'Mercury has a lot to say and, for a change, so should you. A conversation you have been rehearsing goes better unrehearsed. Two invitations land on the same evening—pick the one that makes you nervous. Curiosity is your compass; distraction is its counterfeit. Write it down before it flies off.',motto:'Two minds, one conversation.'},{key:'cancer',l1:'Cancer',l2:'The Crab',tag:'The Nurturer.',short:'A deeper kind of strength. You feel, you care, you create a softer world.',glyph:'♋︎',dates:'Jun 21 – Jul 22',
element:'Water',ruler:'The Moon',fig:'cancer',body:'The Moon pulls the tide in and out; your mood follows, and that is not a flaw. Home asks for a small repair—of a room, or of a silence. Someone you protect no longer needs protecting; try trusting them instead. Memory is a fine place to visit and a poor place to live. Feed people. It works.',motto:'The tide always comes home.'},{key:'leo',l1:'Leo',l2:'The Lion',tag:'The Radiance.',short:'You turn moments into memories. Your light inspires others to shine.',glyph:'♌︎',dates:'Jul 23 – Aug 22',element:'Fire',ruler:'The Sun',fig:'leo',body:'The Sun is in your corner, which you already knew. This week the audience is smaller than you like and more important than you think. Generosity lands harder than brilliance; give the credit away and watch it return doubled. A creative project wants a deadline, not more admiration. Roar less, and mean it more.',motto:'Shine, and let them squint.'},{key:'virgo',l1:'Virgo',l2:'The Maiden',tag:'The Refined.',short:'A quiet mind creates extraordinary things. You find beauty in what others overlook.',glyph:'♍︎',dates:'Aug 23 – Sep 22',element:'Earth',ruler:'Mercury',fig:'virgo',
body:'Mercury sharpens the pencil and you find the mistake nobody else saw. Fix it, then resist the urge to fix the person who made it. Your body is sending a memo about sleep; read it. Perfection is a direction, not an address. Make the list, cross off three things, and call that a win.',motto:'Details are where the devil hides.'},{key:'libra',l1:'Libra',l2:'The Scales',tag:'The Harmonizer.',short:'You see the world in balance. Kindness, beauty and fairness guide your way.',glyph:'♎︎',dates:'Sep 23 – Oct 22',element:'Air',ruler:'Venus',fig:'libra',body:'Venus dresses the room and you are asked to choose a side after all. You can. The fairness you extend to everyone else is owed to you too—collect some. A partnership tilts; a single honest sentence levels it. Beauty is not a luxury this week, it is a strategy. Decide by Friday; the scales are tired.',motto:'Balance is a verb.'},{key:'scorpio',l1:'Scorpio',l2:'The Scorpion',tag:'The Transformer.',short:'Depth is your power. You feel what’s hidden and turn endings into new beginnings.',glyph:'♏︎',dates:'Oct 23 – Nov 21',element:'Water',ruler:'Pluto',fig:'scorpio',
body:'Pluto works in the basement, and so do you. Something ends this week so that something truer can start, and only you will notice the exchange. Keep the secret that is yours; release the one that is not. Intensity is a tool, not a personality. Trust is expensive—that is why it is worth something.',motto:'Still waters, deep intentions.'},{key:'sagittarius',l1:'Sagittarius',l2:'The Archer',tag:'The Seeker.',short:'A free spirit with a bigger horizon. You chase truth, adventure and a more meaningful life.',glyph:'♐︎',dates:'Nov 22 – Dec 21',element:'Fire',ruler:'Jupiter',fig:'sagittarius',body:'Jupiter widens the road and you were already halfway out the door. A plan to travel—by plane, by book, by argument—is worth making now. The truth you are about to tell is correct and badly timed; wait a day. Optimism is your engine; aim it. The far target is the near one, seen honestly.',motto:'Aim past the target.'},{key:'capricorn',l1:'Capricorn',l2:'The Sea-Goat',tag:'The Builder.',short:'You turn vision into reality. Discipline today creates a brighter tomorrow.',glyph:'♑︎',dates:'Dec 22 – Jan 19',element:'Earth',ruler:'Saturn',fig:'capricorn',
body:'Saturn keeps the books and this week the books balance in your favour. Work you did years ago pays out in a form you did not expect. Ambition is not the same as hurry; you have known this longer than most. Let someone younger carry a box. The summit is a good place to sit for a minute.',motto:'The mountain moves for the patient.'},{key:'aquarius',l1:'Aquarius',l2:'The Water-Bearer',tag:'The Visionary.',short:'You see what others can’t yet. A unique mind creates a kinder future.',glyph:'♒︎',dates:'Jan 20 – Feb 18',element:'Air',ruler:'Uranus',fig:'aquarius',body:'Uranus throws the switch and the room rearranges; you were the only one not surprised. An idea that sounded strange in January sounds inevitable now—say it in public. Friendship asks for presence, not theory. Being right is cheap; being useful is rare. The future is a group project. Recruit.',motto:'Tomorrow is a place you\'re from.'},{key:'pisces',l1:'Pisces',l2:'The Fish',tag:'The Dreamer.',short:'Neptune blurs the edges and for once the blur is kind. A dream repeats until you write it down; do that.',glyph:'♓︎',dates:'Feb 19 – Mar 20',element:'Water',ruler:'Neptune',fig:'pisces',
body:'Neptune blurs the edges and for once the blur is kind. A dream repeats until you write it down; do that. Boundaries are not walls, they are the shore that lets the tide be beautiful. Someone needs your imagination more than your sympathy. Swim toward the light, and keep one eye on the boat.',motto:'Swim both ways at once.'}],l={aries:{tagline:'The First Flame.',modality:'Cardinal',acc:'#e0a58a',intro:'Aries opens the zodiac the way it opens everything: first, fast, and without checking whether the door was locked. Ruled by Mars and born at the equinox, it is the cardinal fire sign—the spark that starts the season rather than the fire that keeps it.',statement:'You would rather be wrong at speed than right too late.',strengths:['Courage that arrives before the plan','Honesty with no back room','Energy that pulls a room forward','A short memory for grudges'],tendencies:['Starts more than it finishes','Hears a pause as a no','Competes with people who didn’t know it was a race'],motivations:['Being first to a new thing','A clear opponent, real or invented','Proof that effort changes outcomes'],
weaknesses:['Impatience dressed as decisiveness','A temper with a fast fuse and a faster apology','Boredom once the fight is won'],love:'Aries falls quickly and openly, and expects the same in return. Attraction is a chase it enjoys running, but the prize it actually wants is a partner who can keep pace and push back. Affection is physical and immediate—a hand on the back, a plan made on the spot. What it cannot do is wait to be chosen; tell it, plainly, and early.',friendship:'The friend who answers the phone at two in the morning and arrives with the engine running. Aries says the thing everyone is thinking, forgives by the next morning, and forgets to ask how you are only because it assumes you’d say. It values loyalty shown in action, hates being managed, and fights loudly, then not at all.',work:'Aries is built for the beginning: the pitch, the launch, the first crisis. It sets a pace others measure themselves against and takes ownership without being asked. Hand it the thing nobody wants to start. Give it a finish line, a rival, and permission to move; keep the maintenance for someone else.',
thrives:['Start-ups and first days','Roles with a visible scoreboard','Teams that argue in the open'],ghosts:['FIRST','IGNITE','PURSUIT','ALLY','CHARGE']},taurus:{tagline:'The Steady Ground.',modality:'Fixed',acc:'#a9c49a',intro:'Taurus arrives when the ground is warm and the trees have committed. It is the fixed earth sign, ruled by Venus: a lover of textures, tables, slow mornings and things that last. Where Aries strikes the match, Taurus builds the hearth.',statement:'Anything worth having is worth taking your time over.',strengths:['Patience that outlasts most problems','Taste—real, physical, unhurried','Loyalty with a long memory','Calm under other people’s panic'],tendencies:['Mistakes routine for peace','Digs in when pushed, even when wrong','Buys the good version'],motivations:['Security you can touch','Beauty in daily things','Being relied on and not rushed'],weaknesses:['Stubbornness that looks like principle','A slow start on change','Possessiveness, of things and of people'],
love:'Taurus courts slowly and means it. It shows love through the senses—cooking, touch, the good blanket—and asks for consistency more than fireworks. Once committed it is steady to the point of immovable, which is a gift until it is asked to change its mind. Woo it with time, and never with pressure.',friendship:'The friend whose house you end up in. Taurus is loyal in the old-fashioned way, keeps its word, and would rather have three friends for thirty years than thirty for three. Conflict makes it go quiet, not loud; give it a day. It values reliability, good food, and being told the truth gently.',work:'Taurus finishes. It builds systems that hold, keeps its head when the plan wobbles, and handles money as if it were its own. It resents being hurried and shines when given a craft and the room to do it properly. Pay it fairly, respect its process, and let it own the quality.',thrives:['Craft and long projects','Finance, food, design','Calm, well-resourced teams'],ghosts:['ROOT','STEADY','TENDER','HEARTH','BUILD']},gemini:{tagline:'Two Minds, One Sky.',modality:'Mutable',acc:'#a7d3e6',
intro:'Gemini is the mutable air sign, ruled by Mercury and twinned by nature: the conversation in the room and the one in its head. It collects people, facts and possibilities with equal appetite, and connects them faster than it can explain.',statement:'Curiosity is the only loyalty you never have to fake.',strengths:['Wit that makes a room lighter','Learns anything, fast','Sees both sides before choosing','Endless social range'],tendencies:['Drops threads mid-sentence','Restless when nothing is new','Talks its way out of feelings'],motivations:['A new idea before breakfast','Being understood in full','Mental company that keeps up'],weaknesses:['Inconsistency mistaken for freedom','Nervous energy with nowhere to go','Surface where depth was needed'],love:'Gemini falls for a mind first. It wants a partner who is a good conversation at midnight and a better one at breakfast, who tolerates the changes of mood and matches them with humour. Romance is light, verbal and constant; commitment comes when it stops being bored. Keep it curious and it keeps its word.',
friendship:'The friend who knows everyone and remembers what you said last spring. Gemini communicates by volume—messages, links, voice notes—and treats every plan as provisional. It values a good laugh over a long history, forgives quickly, and resolves conflict by talking until it’s funny again.',work:'Gemini thinks in the open. It is the connector, the writer, the one who explains the thing to the people who need to hear it. It thrives on variety and wilts in a rut; give it two projects, not one. It sells ideas, mediates rooms, and gets restless the moment the work becomes maintenance.',thrives:['Writing, media, teaching','Fast rooms with many voices','Two problems at once'],ghosts:['TWINS','SPEAK','SPARK','SIGNAL','SHIFT']},cancer:{tagline:'The Tide Keeper.',modality:'Cardinal',acc:'#8fb0e8',intro:'Cancer begins with the solstice and the longest light. It is the cardinal water sign, ruled by the Moon: protective, intuitive, moved by tides it doesn’t always name. Its home is wherever the people it loves are, and it will build one there.',statement:'You remember everything, and you forgive most of it.',
strengths:['Intuition that is usually right','Care that shows up in action','Memory for what matters to people','A fierce protective streak'],tendencies:['Retreats into the shell when hurt','Feeds people instead of saying it','Reads moods, then absorbs them'],motivations:['A home that feels safe','Being needed and not taken for granted','Keeping the circle whole'],weaknesses:['Moodiness on a lunar schedule','Holds hurts too long','Passive when it should be plain'],love:'Cancer loves with the whole house. It wants to nurture and be nurtured, remembers anniversaries you forgot you’d mentioned, and reads silences as weather. It needs security before it opens, and tests gently before it trusts. Once it does, it is loyal to the bone—and it expects the same.',friendship:'The friend who sets a place for you without asking. Cancer tends friendships like plants, notices the small change in your voice, and keeps the old ones going across decades. It hates confrontation and goes quiet rather than sharp; tell it plainly when something is wrong. It values being remembered in return.',
work:'Cancer builds cultures. It tends the team, senses the problem before the metrics do, and turns workplaces into places people stay. It leads by care, prefers a stable base to a new adventure, and protects what it has made. Give it people to look after and a mission with a heart.',thrives:['Care, hospitality, education','Teams with history','Roles that protect something'],ghosts:['TIDE','SHELTER','HOLD','MOON','KEEP']},leo:{tagline:'The Held Light.',modality:'Fixed',acc:'#e0a58a',intro:'Leo is the fixed fire sign, ruled by the Sun in the heart of summer. It is warmth as a personality—generous, theatrical, loyal—and it carries itself as if the room were already watching, which, usually, it is.',statement:'You are not asking for attention. You are offering something worth it.',strengths:['Generosity that isn’t keeping score','Courage in front of a crowd','Warmth that makes people brave','Loyalty to its own'],tendencies:['Needs the applause more than it admits','Takes criticism as betrayal','Performs even when alone'],motivations:['Being seen, and seen accurately','Making something beautiful and public','A court worth ruling well'],
weaknesses:['Pride that won’t apologise first','A blind spot for its own volume','Sulks when unlit'],love:'Leo loves grandly and wants it grand in return: the gesture, the celebration, the story told later. It is a devoted and demonstrative partner who needs to feel admired to feel safe. It gives its warmth freely and takes coolness as rejection. Praise it honestly, and it will make you the centre of its world.',friendship:'The friend who organises the party and makes you the guest of honour. Leo is loyal, generous with time and money, and fiercely protective of its circle. It wants to be celebrated back and will sulk if forgotten. Conflict is dramatic and brief; it apologises with a gesture, not the words.',work:'Leo leads from the front. It performs, presents, rallies, and makes work feel like something worth doing. It thrives on ownership and visible results and wilts in anonymity. Give it the stage and the responsibility that comes with it; it will rise, and take the team with it.',thrives:['Leadership and the stage','Brand, creative, hospitality','Rooms that need a heart'],ghosts:['SHINE','HEART','LOYAL','CROWN','RADIATE']},virgo:{tagline:'The Quiet Edit.',modality:'Mutable',
acc:'#a9c49a',intro:'Virgo is the mutable earth sign, ruled by Mercury at the turn of the harvest. It notices—the crooked frame, the missing word, the thing you said in April—and it improves, quietly and constantly, whatever it touches.',statement:'Care is a detail nobody else was going to check.',strengths:['Precision without fuss','Service that expects no thanks','A mind that sorts chaos','Honesty, offered gently'],tendencies:['Fixes before it’s asked','Worries in advance','Holds itself to a stricter rule'],motivations:['Being useful and correct','Systems that finally work','Health, order, competence'],weaknesses:['Criticism that starts at home','Anxiety with a to-do list','Perfectionism that stalls'],love:'Virgo loves in acts, not declarations: the fixed shelf, the remembered allergy, the plan that ran on time. It is slow to trust and thorough when it does. It needs to feel useful and hates to feel judged, which is ironic, and it knows. Be patient with its standards; they include itself.',
friendship:'The friend with the spare charger and the sensible advice. Virgo is discreet, dependable and a little exacting; it shows care by improving your life around the edges. It says the hard thing kindly and expects the same. It values reliability, honesty, and being appreciated for the invisible work.',work:'Virgo is the reason the thing works. It edits, audits, organises and refines, and holds a standard others quietly rely on. It thrives with autonomy and a clear brief, and struggles with vagueness and mess. Give it the problem nobody else can untangle, and the credit it won’t ask for.',thrives:['Editing, health, analysis','Quiet, well-run teams','Work that rewards care'],ghosts:['PRECISE','TEND','ORDER','HARVEST','REFINE']},libra:{tagline:'The Balanced Hour.',modality:'Cardinal',acc:'#a7d3e6',intro:'Libra begins at the equinox, when day and night are equal. It is the cardinal air sign, ruled by Venus: drawn to beauty, allergic to unfairness, and better at weighing than choosing. It is the sign that makes rooms civil.',statement:'Fairness is not a feeling. It is something you do, out loud.',
strengths:['Diplomacy that actually resolves','An eye for beauty and proportion','Charm without cruelty','Seeing the other side'],tendencies:['Decides by consulting','Keeps the peace at its own expense','Mirrors the room'],motivations:['Harmony worth having','Partnership, in everything','Justice done gracefully'],weaknesses:['Indecision that outlasts patience','Avoids the necessary fight','Vanity, lightly held'],love:'Libra is built for two. It courts with grace, notices what makes you feel seen, and treats partnership as an art form. It wants a companion who is fair, attractive in the widest sense, and willing to talk things through. It dislikes conflict enough to avoid it too long; ask it directly what it wants.',friendship:'The friend who makes everyone feel included and never picks the restaurant. Libra keeps a wide, elegant circle, mediates its quarrels, and is genuinely interested in your side. It hates ugly conflict and will smooth rather than confront; it values kindness, taste, and being asked for its opinion.',
work:'Libra negotiates. It is the person who finds the version everyone can live with, designs the thing that looks right, and keeps the client in the room. It thrives in partnership and struggles alone with a hard choice. Give it people, aesthetics, and a deadline for the decision.',thrives:['Design, law, diplomacy','Partnerships and pairs','Rooms with taste'],ghosts:['POISE','MIRROR','ACCORD','GRACE','EQUAL']},scorpio:{tagline:'The Deep Water.',modality:'Fixed',acc:'#8fb0e8',intro:'Scorpio is the fixed water sign, ruled by Pluto, arriving as the light fails. It goes where others don’t look, keeps what it finds, and loves with a seriousness that can frighten people who wanted something lighter.',statement:'You don’t want to be liked. You want to be known, exactly.',strengths:['Loyalty that survives everything','Insight into what people hide','Resolve that doesn’t wobble','Courage in dark places'],tendencies:['Tests before it trusts','Keeps the score privately','All or nothing, usually all'],motivations:['Truth, however it lands','Intimacy without pretence','Transformation—its own, then everyone’s'],
weaknesses:['Jealousy it would deny','A long memory for betrayal','Control mistaken for care'],love:'Scorpio loves completely or not at all. It wants depth, honesty and a partner who won’t flinch, and it offers a loyalty that is close to absolute. Trust is built slowly and broken once. Passion is intense and private; the surface stays calm. Be honest early—it will know anyway.',friendship:'The friend who keeps your secret and expects you to keep theirs. Scorpio has few friends and means every one of them. It notices what you didn’t say, defends you when you’re not there, and cuts contact with the disloyal for good. It values truth, discretion, and being trusted with the real thing.',work:'Scorpio is relentless. It researches, investigates, sees the game under the game, and finishes what it started long after others left. It thrives with autonomy and stakes, and resents being watched. Give it the hard problem, the sensitive file, or the turnaround nobody else will touch.',thrives:['Research, strategy, crisis','Depth over breadth','Roles built on trust'],ghosts:['DEPTH','RESOLVE','VEIL','TRUTH','RENEW']},sagittarius:{tagline:'The Far Horizon.',modality:'Mutable',acc:'#e0a58a',
intro:'Sagittarius is the mutable fire sign, ruled by Jupiter as the year turns dark. It is the arrow already in the air: philosophical, blunt, restless, generous—looking for the horizon, and for the meaning behind it.',statement:'The truth is worth the trip, and the trip is the point.',strengths:['Optimism with legs','Honesty that clears a room','Range—of interests, places, people','Humour as a compass'],tendencies:['Overpromises, then delivers something bigger','Leaves before the ending','Says it before checking the room'],motivations:['Freedom to move','A bigger question','Being right about something that matters'],weaknesses:['Tactlessness sold as candour','A short attention span for details','Restlessness that reads as flight'],love:'Sagittarius wants a companion for the road, not a reason to stay home. It is warm, direct and fun, allergic to possessiveness, and honest to a fault about what it feels. It commits to people who expand its world and leaves ones who shrink it. Give it room and it will keep coming back.',
friendship:'The friend who suggests the trip and books it that night. Sagittarius is generous, funny and frank, and treats friendship as a series of adventures. It disappears for a month and returns as if nothing happened. It values honesty, humour and freedom, and forgives almost anything except a small mind.',work:'Sagittarius sees the big picture and says it out loud. It teaches, explores, sells the vision and questions the premise. It thrives with variety, travel and a mission, and suffocates under supervision. Give it the frontier and the freedom to tell the truth about what it finds there.',thrives:['Travel, teaching, publishing','Missions with meaning','Room to roam'],ghosts:['ARROW','ROAM','BELIEVE','HORIZON','LAUGH']},capricorn:{tagline:'The Long Climb.',modality:'Cardinal',acc:'#a9c49a',intro:'Capricorn begins at the solstice and climbs out of the dark. It is the cardinal earth sign, ruled by Saturn: ambitious, disciplined, dry-humoured, and playing a longer game than anyone in the room suspects.',statement:'Patience is ambition that has done the maths.',
strengths:['Discipline that compounds','Judgement, cool and fair','Responsibility taken, not assigned','A dry, excellent wit'],tendencies:['Works when it should rest','Measures itself by the summit','Hides tenderness behind competence'],motivations:['Mastery and its proof','Building something that outlasts it','Respect earned, not granted'],weaknesses:['Pessimism dressed as realism','Coldness under pressure','Difficulty asking for help'],love:'Capricorn courts seriously and slowly, and shows love through reliability: the promise kept, the future planned. It is more tender than it looks and worse at saying so. It wants a partner it respects, and one who understands that work is part of who it is. Loyalty, once given, is permanent.',friendship:'The friend who shows up on time and remembers the thing you’re worried about. Capricorn keeps a small, old circle and is funnier in it than anyone expects. It gives advice like a strategist and support like a wall. It values competence, loyalty, and not being asked to perform enthusiasm.',
work:'Capricorn is the long game. It plans, executes, manages risk and rises, steadily, to the top of whatever it committed to. It thrives with clear hierarchy and real responsibility, and resents chaos and flattery. Give it authority in proportion to its results, and watch the results follow.',thrives:['Leadership, finance, structure','Institutions worth building','Long, serious projects'],ghosts:['CLIMB','ENDURE','SUMMIT','STONE','PROVE']},aquarius:{tagline:'The Distant Signal.',modality:'Fixed',acc:'#a7d3e6',intro:'Aquarius is the fixed air sign, ruled by Uranus, born in the deep of winter. It stands a little apart—observing, inventing, belonging to the group and to no one—and it is usually right a decade early.',statement:'The future is a place you already live. Everyone else is commuting.',strengths:['Originality that isn’t a pose','Humanitarian instinct at scale','Detachment when it counts','Loyalty to ideas and to friends'],tendencies:['Intellectualises the feeling','Contrarian by reflex','Warmer to the crowd than the couple'],motivations:['A better system, for everyone','Freedom to think oddly','Friends who are also a cause'],
weaknesses:['Aloofness mistaken for coldness','Stubborn about its own theories','Discomfort with intimacy'],love:'Aquarius loves as a friend first and never stops being one. It needs space, honesty and a partner who is interesting rather than merely available. Romance is unconventional, affection intermittent but sincere. It resists possession and rewards independence. Ask it questions; it will stay for the conversation.',friendship:'The friend with the strange, correct idea and the group chat that changed your life. Aquarius is loyal to its people and its principles, and treats friendship as a kind of citizenship. It is present in ways that don’t look like presence. It values freedom, fairness, and being allowed to be odd.',work:'Aquarius invents. It sees the system, questions it, and builds the thing that replaces it. It thrives in teams with a mission and dies in bureaucracy. Give it a problem the old way can’t solve, a network to work through, and the freedom to be early.',thrives:['Technology, science, activism','Networks and collectives','The unexplored idea'],ghosts:['SIGNAL','FUTURE','OUTLIER','CURRENT','FREE']},pisces:{tagline:'The Open Sea.',modality:'Mutable',
acc:'#8fb0e8',intro:'Pisces closes the circle as the mutable water sign, ruled by Neptune at the edge of spring. It absorbs, imagines, empathises and dissolves, and it carries a little of every sign that came before it.',statement:'You feel it before it happens, and you forgive it before it ends.',strengths:['Empathy that changes the room','Imagination without a ceiling','Compassion for the difficult','Intuition close to sight'],tendencies:['Escapes when it should stay','Takes on other people’s weather','Says yes to avoid the no'],motivations:['Connection beyond words','Making something beautiful from feeling','Being safe enough to dream'],weaknesses:['Boundaries, or the lack of them','Idealism that gets disappointed','Vagueness when clarity was owed'],love:'Pisces loves like a tide—all in, all around, sometimes all at once. It is romantic, intuitive and forgiving to a fault, and it needs a partner who can be gentle with its openness and honest about the ground. It merges easily; the work is remembering where it ends. Be kind, and be clear.',
friendship:'The friend who knows something is wrong before you do and doesn’t make you explain. Pisces listens like it’s the only thing happening, forgives easily, and drifts away when overwhelmed rather than fighting. It values gentleness, imagination, and being reminded of the shore.',work:'Pisces creates and cares. It is the artist, the healer, the person who senses what the audience needs before the brief does. It thrives with atmosphere and purpose and struggles with hard edges and harder managers. Give it a creative problem, a humane team, and protected time to dream.',thrives:['Art, care, music, film','Purpose over process','Soft light, protected time'],ghosts:['DRIFT','DREAM','MERGE','DEPTH','SHORE']}},c={'aries|taurus':'Spark meets stone. Aries lights it; Taurus decides whether it stays lit.','aries|gemini':'Two fast minds, one impulse. The plan changes hourly and nobody minds.','aries|cancer':'Fire and tide. Aries charges; Cancer feels the cost. Tender if both slow down.','aries|leo':'Two suns in one room. Loud, loyal, and better at winning than at sharing.','aries|virgo':'Aries starts, Virgo checks. Friction, then a surprisingly finished project.',
'aries|libra':'Opposites on the wheel. Aries decides, Libra weighs; each is what the other lacks.','aries|scorpio':'Both once ruled by Mars. Intense, honest, and not for the faint of heart.','aries|sagittarius':'Fire and fire. Fast, funny, restless—the adventure rarely needs a reason.','aries|capricorn':'The sprinter and the climber. Different clocks, same summit.','aries|aquarius':'Impulse meets invention. Aries acts, Aquarius reframes; both hate a cage.','aries|pisces':'Neighbours on the wheel. Aries wakes the dreamer; Pisces softens the fighter.','taurus|gemini':'Slow and quick. Gemini talks; Taurus listens until it’s time to eat.','taurus|cancer':'Home built twice. Sensual, protective, and quietly permanent.','taurus|leo':'Two fixed signs. Loyal, luxurious, and immovable on the same night.','taurus|virgo':'Earth and earth. Practical devotion, tidy kitchens, plans that hold.','taurus|libra':'Both ruled by Venus. Beauty agreed on; the decision takes a while.','taurus|scorpio':'Opposites: possession meets passion. Deep, stubborn, lasting if trusted.','taurus|sagittarius':'The hearth and the horizon. One stays, one goes; both come back for dinner.',
'taurus|capricorn':'Earth aligned. Patient, ambitious, and rich in twenty years.','taurus|aquarius':'Tradition versus tomorrow. Fixed on different things; respect is the bridge.','taurus|pisces':'The ground and the sea. Taurus steadies the dream; Pisces softens the ground.','gemini|cancer':'Words meet feelings. Gemini explains; Cancer remembers. Gentle translation needed.','gemini|leo':'Wit and warmth. Gemini writes the lines; Leo delivers them.','gemini|virgo':'Both ruled by Mercury. Two editors, one sentence, endless notes.','gemini|libra':'Air and air. Conversation as courtship; the party never quite ends.','gemini|scorpio':'Surface meets depth. Fascinating, wary, and honest only if both try.','gemini|sagittarius':'Opposites who agree on everything except the details. Restless and joyful.','gemini|capricorn':'The improviser and the planner. Gemini loosens; Capricorn lands.','gemini|aquarius':'Two minds ahead of the room. Ideas first, feelings eventually.','gemini|pisces':'Signal and tide. Gemini names it; Pisces feels it. Both change their minds.','cancer|leo':'Moon and Sun, side by side. Cancer holds; Leo shines; each needs the other.',
'cancer|virgo':'Care in two languages: one feels it, one fixes it. Quietly ideal.','cancer|libra':'Tenderness and tact. Both avoid the fight; someone has to say it.','cancer|scorpio':'Water and water. Deep loyalty, long memory, a fortress for two.','cancer|sagittarius':'The nest and the road. Loving from different distances.','cancer|capricorn':'Opposites: home and career. Together, an institution.','cancer|aquarius':'Heart meets head. Cancer wants closeness; Aquarius wants the cause. Negotiable.','cancer|pisces':'Tide and sea. Intuitive, forgiving, sometimes too soft to steer.','leo|virgo':'The performer and the critic. Better together than either admits.','leo|libra':'Glamour and grace. A beautiful pair who both want the compliment.','leo|scorpio':'Fixed fire, fixed water. Magnetic, jealous, and nobody yields first.','leo|sagittarius':'Fire and fire. Generous, loud, and always on the guest list.','leo|capricorn':'The crown and the ledger. Leo wants glory; Capricorn wants the building.','leo|aquarius':'Opposites: the star and the crowd. One performs; one organises the applause.','leo|pisces':'Warmth and water. Leo protects the dreamer; Pisces adores the light.',
'virgo|libra':'Precision and poise. Everything is considered; nothing is decided.','virgo|scorpio':'Analysis meets intuition. Discreet, thorough, unnervingly perceptive.','virgo|sagittarius':'The detail and the big picture. Arguments that improve both.','virgo|capricorn':'Earth aligned. Competence in stereo; someone please book the holiday.','virgo|aquarius':'The fixer and the inventor. Different tools, a shared belief in better.','virgo|pisces':'Opposites: order and ocean. Each is the other’s missing half.','libra|scorpio':'Charm and depth. Libra smooths; Scorpio sees through it. Intriguing.','libra|sagittarius':'Air feeds fire. Social, honest, and forever planning the next trip.','libra|capricorn':'Grace meets structure. A partnership run like a good firm.','libra|aquarius':'Air and air. Ideals, friends, and a fair deal for everyone.','libra|pisces':'Beauty and dream. Lovely, kind, and short on decisions.','scorpio|sagittarius':'Depth and distance. Scorpio wants all of it; Sagittarius wants the road.','scorpio|capricorn':'Power respected. Serious, private, and built to last.','scorpio|aquarius':'Two fixed signs, two agendas. Fascinating; nobody blinks.',
'scorpio|pisces':'Water and water. Psychic, devoted, and best kept honest.','sagittarius|capricorn':'The wanderer and the climber. One maps the sky, one the mountain.','sagittarius|aquarius':'Fire and air. Freedom shared; the future discussed at length.','sagittarius|pisces':'Both once ruled by Jupiter. Faith and feeling, loosely tethered.','capricorn|aquarius':'Both once ruled by Saturn. Structure and revolution, oddly allied.','capricorn|pisces':'Stone and sea. Capricorn steadies; Pisces softens. Complementary.','aquarius|pisces':'Neighbours: the signal and the sea. Ideals meet empathy; both drift.'},h={w:9600,h:9e3},d=[[224,228,232],[214,222,230],[188,208,228],[170,196,214],[160,190,214],[204,216,230],[218,224,230],[219,190,172]];function u(e,t,a,o,s){const r=[];for(let i=0;i<s;i++){const l=i/(s-1);r.push([n(e,a,l),n(t,o,l)])}return r}function m(e){this.P=[],this.E=[],this.r=t(e)}function f(e,t,a,n){const o=new m(e),s=t.map((e=>o.pt(e[0],e[1],e[2])));for(const[e,n]of a){const a=t[e],r=t[n],i=Math.max(1,Math.round(6*Math.hypot(r[0]-a[0],r[1]-a[1]))),l=u(a[0],a[1],r[0],r[1],i+2).slice(1,-1);if(l.length){const t=o.chain(l,{m:.2,j:.004});o.link(s[e],t[0]),o.link(t[t.length-1],s[n])
