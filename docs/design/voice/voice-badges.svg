<text x="40" y="50" font-size="18" font-weight="700" fill="#2dd4bf" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">Voice flow: what the avatar's badge shows</text><text x="40" y="72" font-size="12.5" font-weight="500" fill="#7f9999" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">No sound. The badge sits on the avatar like any notification; a tooltip says what it means and offers one action. Works with any mascot.</text><rect x="40" y="96" width="275" height="230" rx="18" fill="#0d141b" stroke="#1b2a33"/><circle cx="177" cy="166" r="32" fill="url(#fabG)" stroke="#1f3b40"/><circle cx="177" cy="166" r="39" fill="none" stroke="#2dd4bf" stroke-opacity=".75" stroke-width="2.5"/><circle cx="177" cy="166" r="47" fill="none" stroke="#2dd4bf" stroke-opacity=".28" stroke-width="2"/><use href="#snail" x="149" y="138" width="56" height="56"/><g transform="translate(207,138)"><g><circle r="15" fill="#14b8a6" stroke="#070b10" stroke-width="3"/><line x1="-8" y1="-2.0" x2="-8" y2="2.0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="-4" y1="-4.5" x2="-4" y2="4.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="-7.0" x2="0" y2="7.0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="4" y1="-4.5" x2="4" y2="4.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="8" y1="-2.0" x2="8" y2="2.0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="177" y="236" font-size="14" font-weight="700" fill="#d6e4e4" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">Listening</text><text x="177" y="258" font-size="11.5" font-weight="500" fill="#7f9999" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">Speak now. Same shortcut sends.</text><rect x="335" y="96" width="275" height="230" rx="18" fill="#0d141b" stroke="#1b2a33"/><circle cx="472" cy="166" r="32" fill="url(#fabG)" stroke="#1f3b40"/><circle cx="472" cy="166" r="39" fill="none" stroke="#2dd4bf" stroke-opacity=".25" stroke-width="3"/><path d="M472,127 A39,39 0 0 1 511,166" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/><use href="#snail" x="444" y="138" width="56" height="56"/><g transform="translate(502,138)"><g><circle r="15" fill="#14b8a6" stroke="#070b10" stroke-width="3"/><path d="M-6,0 A6,6 0 1 1 0,6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="472" y="236" font-size="14" font-weight="700" fill="#d6e4e4" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">Sending</text><text x="472" y="258" font-size="11.5" font-weight="500" fill="#7f9999" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">Your message is going to the chat.</text><rect x="630" y="96" width="275" height="230" rx="18" fill="#0d141b" stroke="#1b2a33"/><circle cx="767" cy="166" r="32" fill="url(#fabG)" stroke="#1f3b40"/><use href="#snail" x="739" y="138" width="56" height="56"/><g transform="translate(797,138)"><g><circle r="15" fill="#22c55e" stroke="#070b10" stroke-width="3"/><path d="M-5.5,0.5 L-1.8,4.3 L5.8,-4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="767" y="236" font-size="14" font-weight="700" fill="#d6e4e4" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">Sent</text><text x="767" y="258" font-size="11.5" font-weight="500" fill="#7f9999" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">Open the chat when you want to see it.</text><rect x="724.5" y="280" width="85" height="26" rx="13" fill="#2dd4bf" stroke="#2dd4bf"/><text x="767.0" y="297.5" font-size="12" font-weight="600" fill="#04201c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">Open chat</text><rect x="92