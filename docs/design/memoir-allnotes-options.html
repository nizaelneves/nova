<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Notes Options</title>
<style>
:root{color-scheme:dark;--a:#8fe3ff;--v:#a78bfa;--m:#e879f9}
body{margin:0;padding:28px;background:#04030d;color:#eef0ff;font:14px 'Segoe UI',system-ui,sans-serif}
h1{font-weight:400;letter-spacing:.06em;margin:0 0 4px} p.lead{color:rgba(238,240,255,.5);margin:0 0 26px}
.row{display:flex;flex-wrap:wrap;gap:16px}
.opt{width:260px;padding:14px;border-radius:16px;border:1px solid rgba(160,175,255,.16);background:rgba(143,227,255,.04)}
.opt h4{margin:0 0 2px;font-weight:600}.opt small.d{display:block;color:rgba(238,240,255,.5);margin-bottom:12px;line-height:1.4;min-height:34px}
.side{display:grid;gap:3px;padding:12px;border-radius:12px;background:rgba(0,0,0,.28)}
.nav{display:flex;align-items:center;gap:9px;padding:5px 9px;border-radius:8px;font-size:12.5px;color:rgba(238,240,255,.6);cursor:pointer;transition:.25s;position:relative}
.nav svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav em{margin-left:auto;font:normal 11px ui-monospace,Consolas,monospace;color:rgba(238,240,255,.4)}
.nav:hover{background:rgba(255,255,255,.05);color:#fff}
.cur{background:rgba(94,242,176,.12);color:#5ef2b0}
/* 0 current */
/* 1 accent bar */
.o1 .on{background:linear-gradient(90deg,rgba(143,227,255,.16),rgba(124,92,255,.06));color:#fff}
.o1 .on::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:2px;border-radius:2px;background:linear-gradient(#8fe3ff,#e879f9);box-shadow:0 0 8px #8fe3ff}
/* 2 pill counter */
.o2 .on{background:rgba(143,227,255,.1);color:#bfeaff}
.o2 .on em{padding:1px 8px;border-radius:999px;background:rgba(143,227,255,.18);color:#e9fbff;font-weight:600}
.o2 .nav em{padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.06)}
/* 3 icon glow */
.o3 .on{color:#fff;background:rgba(124,92,255,.14)}
.o3 .nav:hover svg,.o3 .on svg{color:#8fe3ff;filter:drop-shadow(0 0 6px rgba(143,227,255,.9))}
/* 4 gradient active */
.o4 .on{color:#04101c;font-weight:600;background:linear-gradient(90deg,#8fe3ff,#a78bfa);box-shadow:0 4px 16px rgba(124,92,255,.35)}
.o4 .on em{color:#04101c}
/* 5 one row, graph as icon */
.o5 .two{display:flex;gap:4px}.o5 .two .nav:first-child{flex:1}.o5 .two .nav:last-child{padding:5px 8px}
.o5 .on{background:rgba(143,227,255,.1);color:#bfeaff;box-shadow:inset 0 0 0 1px rgba(143,227,255,.25)}
.tp{margin:10px 6px 4px;font:10px ui-monospace,Consolas,monospace;letter-spacing:.2em;color:rgba(238,240,255,.35)}
</style></head><body>
<h1>All Notes · Visual Options</h1>
<p class="lead">Mock-ups of the Notes bar. Option 0 is how it is today. Tell me the number you like, or mix (for example 1 + 2 + 3).</p>
<div class="row" id="r"></div>
<script>
const I={all:'<path d="M5 3h10l4 4v14H5z"/><path d="M14 3v5h5M8 12h8M8 16h6"/>',graph:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',link:'<path d="M10 14a4 4 0 0 0 5.5 0l3-3a4 4 0 0 0-5.5-5.5L12 6.500M14 10a4 4 0 0 0-5.500 0l-3 3a4 4 0 0 0 5.500 5.500L12 17.500"/>',layers:'<path d="m12 3 9 5-9 5-9-5zM3 13l9 5 9-5"/>'};
const n=(ic,t,c,cls='')=>`<div class="nav ${cls}"><svg viewBox="0 0 24 24">${I[ic]}</svg><span>${t}</span>${c!==''?`<em>${c}</em>`:''}</div>`;
const defs=[['0 · Today','The green highlight with a plain number.','cur'],['1 · Accent Bar','A colour bar on the left edge and a soft blue-violet wash, like the Memoir menu.','on'],['2 · Pill Counters','Numbers sit in small pills; the active one is brighter.','on'],['3 · Icon Glow','The active icon glows, and icons light up on hover.','on'],['4 · Gradient Active','The active row is a solid gradient chip. Strongest highlight.','on'],['5 · One Row','All Notes and a Graph icon share one row, saving a line.','on']];
document.getElementById('r').innerHTML=defs.map(([t,d,c],i)=>{
 const first=i===5?`<div class="two">${n('all','All Notes','165',c)}${n('graph','','')}</div>`:`${n('all','All Notes','165',c)}${n('graph','Graph','')}`;
 return `<div class="opt o${i}"><h4>${t}</h4><small class="d">${d}</small><div class="side">${first}<div class="tp">TYPES</div>${n('link','Bookmarks','9')}${n('layers','Collections','3')}</div></div>`}).join('');
</script></body></html>
