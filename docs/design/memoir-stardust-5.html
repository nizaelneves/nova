<!doctype html>
<meta charset="utf-8"><title>Phibe, Nebula That Becomes</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(ellipse at 50% 130%,#1a0f4d,#04030d 62%);color:#eef0ff;font:13px system-ui;min-height:100vh;display:grid;place-items:center;padding:12px}
.cell{display:grid;justify-items:center;gap:8px}
.cell p{margin:0;text-align:center;color:rgba(238,240,255,.62);line-height:1.45;max-width:420px;font-size:12.5px}
.cell b{display:block;color:#fff;font-size:15px;margin-bottom:2px}
.box{position:relative;width:360px;height:280px;cursor:pointer}
canvas,svg{position:absolute;inset:0;width:360px;height:280px}
svg{pointer-events:none;overflow:visible}
.bar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:420px}
.bar button{padding:4px 11px;border-radius:999px;border:1px solid rgba(160,175,255,.3);background:rgba(143,227,255,.06);color:#cfd6ff;font:12px system-ui;cursor:pointer}
.bar button[data-on='1']{background:linear-gradient(90deg,#8fe3ff,#a78bfa);color:#04101c;border-color:transparent}
.bar .sep{width:1px;background:rgba(160,175,255,.25);margin:0 4px}
.bar .become{border-color:rgba(32,231,170,.5)}
.bar .become[data-on='1']{background:linear-gradient(90deg,#8fe3ff,#20e7aa)}
</style>
<div class="cell" id="a"></div>
<script>
const W=360,H=280,CX=W/2,CY=H/2;
// Phibe's eyes: no brows, no mouth. A tall glowing oval, white at the heart, and a halo. Mood lives in shape, size and light,
// and now also in the nebula: how fast it turns, how tight it holds, how bright its energy burns.
const STATES={auto:null,
  idle:    {sx:1,   sy:1,   glow:.55,arc:0, look:0,tilt:0, spd:1,  size:1,   bright:1},
  curious: {sx:1.1, sy:1.3, glow:1,  arc:0, look:1,tilt:7, spd:1.5,size:.92, bright:1.35},
  happy:   {sx:1,   sy:1,   glow:.9, arc:1, look:0,tilt:-3,spd:2.2,size:1.14,bright:1.6},
  thinking:{sx:.88, sy:1.1, glow:.75,arc:0, look:2,tilt:-8,spd:3.2,size:.96, bright:1.15},
  sleepy:  {sx:1,   sy:1,   glow:.3, arc:-1,look:0,tilt:5, spd:.35,size:.84, bright:.55}};
const O={c2:'#7c5cff',tone:'#d9f6ff',halo:'124,92,255',cols:['143,227,255','167,139,250','232,121,249'],mint:'32,231,170'};
const EW=6.8,EH=10;                      // smaller eyes than before (was 8.6 x 12.6)
const host=document.getElementById('a');
const eye=n=>`<g class="${n}"><ellipse class="h" rx="11" ry="15" fill="${O.c2}" filter="url(#bl)"/>
  <g class="open"><ellipse rx="${EW}" ry="${EH}" fill="url(#eg)"/><ellipse cx="-1.8" cy="-3.2" rx="2" ry="2.8" fill="#fff" opacity=".9"/></g>
  <path class="arc" d="M-7 3 Q0 -6 7 3" fill="none" stroke="${O.tone}" stroke-width="3.6" stroke-linecap="round"/></g>`;
host.innerHTML=`<div class="box"><canvas></canvas><svg viewBox="0 0 ${W} ${H}"><defs>
 <filter id="bl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
 <radialGradient id="eg" cx="38%" cy="30%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="${O.tone}"/><stop offset="1" stop-color="${O.c2}"/></radialGradient></defs>
 <g class="face">${eye('eL')}${eye('eR')}</g></svg></div>
 <div class="bar"></div><div class="bar bar2"></div>
 <p><b>Nebula Of Dark Matter</b>Denser and smaller-eyed. It can also become: gather into the <i>be</i> monogram, or break into the binary the way Phibe does, and gather again.</p>`;
const cv=host.querySelector('canvas'),g=cv.getContext('2d'),dpr=devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;g.scale(dpr,dpr);
const q=s=>host.querySelector(s),face=q('.face');
let mode='auto',form='nebula';
const bar=q('.bar'),bar2=q('.bar2');
Object.keys(STATES).forEach(k=>{const b=document.createElement('button');b.textContent=k[0].toUpperCase()+k.slice(1);b.dataset.on=k==='auto'?1:0;b.onclick=()=>{mode=k;[...bar.children].forEach(c=>c.dataset.on=c===b?1:0)};bar.append(b)});
[['nebula','Nebula'],['be','Become: be'],['bin','Become: binary']].forEach(([k,label])=>{const b=document.createElement('button');b.textContent=label;b.className='become';b.dataset.on=k==='nebula'?1:0;b.onclick=()=>{form=k;[...bar2.children].forEach(c=>c.dataset.on=c===b?1:0)};bar2.append(b)});

// the "be" monogram, sampled from text into points the bits can fly to
const bits=[];
(function(){const c=document.createElement('canvas');c.width=300;c.height=150;const x=c.getContext('2d');
  x.fillStyle='#fff';x.font='900 150px "Segoe UI Black","Arial Black",Arial,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('be',150,80);
  const d=x.getImageData(0,0,300,150).data,pts=[];
  for(let y=0;y<150;y+=3)for(let xx=0;xx<300;xx+=3)if(d[(y*300+xx)*4+3]>140)pts.push([xx-150,y-75]);
  pts.forEach(([tx,ty],i)=>{const a=Math.random()*6.283,r=Math.sqrt(Math.random())*70;
    bits.push({tx:tx*.72,ty:ty*.72,a,r,s:(.2+Math.random()*.6)*(Math.random()<.5?1:-1),z:.8+Math.random()*1.2,c:Math.random()<.35?'32,231,170':Math.random()<.5?'143,227,255':'255,255,255',ch:Math.random()<.5?'0':'1',dl:Math.random()})});
})();
const ring=[];for(let i=0;i<90;i++)ring.push({a:Math.random()*6.28,r:30+Math.random()*70,s:(.15+Math.random()*.5)*(Math.random()<.5?1:-1),z:.7+Math.random()*1.5,c:O.cols[i%3]});
const ease=x=>x*x*(3-2*x);
function glow(x,y,r,c,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(${c},${a})`);gr.addColorStop(1,`rgba(${c},0)`);g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,6.283);g.fill()}

let mx=0,my=0,last=0,near=0,t=0,ph=0,vx=0,vy=0,px=CX,py=CY,bounce=0,blinkT=3,wT=0,wx=0,wy=0,ex=0,ey=0,m=0,dgt=0;
const cur={sx:1,sy:1,glow:.55,arc:0,tilt:0,spd:1,size:1,bright:1},dust=[];
addEventListener('pointermove',e=>{const b=cv.getBoundingClientRect();mx=e.clientX-b.left-CX;my=e.clientY-b.top-CY;last=t;near=Math.hypot(mx,my)<220?1:0});
host.querySelector('.box').addEventListener('pointerdown',()=>{bounce=1;mode='happy';[...bar.children].forEach(c=>c.dataset.on=c.textContent==='Happy'?1:0);setTimeout(()=>{if(mode==='happy'){mode='auto';[...bar.children].forEach(c=>c.dataset.on=c.textContent==='Auto'?1:0)}},1800);for(let i=0;i<34;i++){const a=Math.random()*6.28,v=.8+Math.random()*2.6;dust.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,s:1+Math.random()*1.6})}});

function frame(){
  t+=.016;
  let S=STATES[mode];
  if(!S){const idle=t-last;S=(near&&idle<2.5)?STATES.curious:(idle>9?STATES.sleepy:STATES.idle)}
  for(const k in cur)cur[k]+=(S[k]-cur[k])*.07;
  ph+=.016*cur.spd;const T=ph;
  m+=((form==='be'?1:0)-m)*.035;dgt+=((form==='bin'?1:0)-dgt)*.05;
  const solid=1-m*.82-dgt*.35;          // how much of the dark body is still there
  let gx=0,gy=0;const watching=near&&t-last<2.5;
  if(S.look===1){gx=mx;gy=my}else if(S.look===2){gx=-70;gy=-90}
  else{wT-=.016;if(wT<0){wT=1.6+Math.random()*2.6;wx=(Math.random()-.5)*170;wy=(Math.random()-.5)*90}gx=watching?mx:wx;gy=watching?my:wy}
  const gxn=Math.max(-1,Math.min(1,gx/90)),gyn=Math.max(-1,Math.min(1,gy/90));
  ex+=(gxn*9-ex)*.22;ey+=(gyn*6.5-ey)*.22;
  const lean=S.look===1?.16:.05,hold=1-m*.9;
  const tx=CX+gx*lean*hold+Math.sin(t*.7)*6*hold,ty=CY+gy*lean*.8*hold+Math.sin(t*1.3)*7*hold-bounce*18;
  vx+=(tx-px)*.028;vy+=(ty-py)*.028;vx*=.86;vy*=.86;px+=vx;py+=vy;bounce=Math.max(0,bounce-.02);
  const sp=Math.hypot(vx,vy),sq=Math.min(.16,sp*.04),breath=(1+Math.sin(t*1.7)*.05+bounce*.1)*cur.size,ang=Math.atan2(vy,vx);
  g.clearRect(0,0,W,H);
  const M=fn=>{g.save();g.translate(px,py);g.rotate(ang);g.scale((1+sq)*breath,(1-sq*.6)*breath);g.rotate(-ang);fn();g.restore()};
  // 1) energy: the denser the nebula, the more colour burns inside it
  g.globalCompositeOperation='lighter';
  M(()=>{
    glow(0,0,130,O.halo,.30*solid*cur.bright);
    for(let i=0;i<10;i++){const a=T*.35+i*.628,r=34+Math.sin(t*.7+i*1.7)*16;glow(Math.cos(a)*r*1.2,Math.sin(a*1.15)*r*.85,50+Math.sin(t+i)*8,O.cols[i%3],.27*solid*cur.bright)}
  });
  // 2) dark matter: more lobes, wider and heavier, so the body holds together as a mass of its own
  g.globalCompositeOperation='source-over';
  const lobes=[];
  M(()=>{
    for(let i=0;i<9;i++){
      const a=T*(.2+i*.045)*(i%2?1:-1)+i*.7,r=i?26+Math.sin(t*.6+i*2.1)*14:0,rad=i?40+Math.sin(t*.9+i)*9:56;
      const x=Math.cos(a)*r*1.25,y=Math.sin(a*1.1)*r*.9;lobes.push([x,y,rad,a]);
      const d=g.createRadialGradient(x,y,2,x,y,rad);d.addColorStop(0,`rgba(2,1,10,${.96*solid})`);d.addColorStop(.6,`rgba(4,2,16,${.8*solid})`);d.addColorStop(1,'rgba(6,3,22,0)');
      g.fillStyle=d;g.beginPath();g.arc(x,y,rad,0,6.283);g.fill();
    }
  });
  // 3) light caught on the edges and in the seams between lobes
  g.globalCompositeOperation='lighter';
  M(()=>{lobes.forEach(([x,y,rad,a],i)=>{if(!i)return;const dx=Math.cos(a+1.2),dy=Math.sin(a+1.2);
      glow(x+dx*rad*.8,y+dy*rad*.7,26,O.cols[i%3],(.3+Math.sin(t*1.4+i)*.09)*solid*cur.bright);
      const n=lobes[(i%8)+1];glow((x+n[0])/2,(y+n[1])/2,18,O.cols[(i+1)%3],.16*solid*cur.bright)})});
  for(const p of ring){p.a+=p.s*.008*cur.spd*(1+sp*.15);p.r+=Math.sin(t*.5+p.a*3)*.08;const x=px+Math.cos(p.a)*p.r*1.25*cur.size,y=py+Math.sin(p.a)*p.r*.85*cur.size;
    glow(x,y,p.z*4,p.c,.42*solid);g.fillStyle=`rgba(255,255,255,${.75*solid})`;g.beginPath();g.arc(x,y,p.z*.7,0,6.283);g.fill()}
  // 4) becoming: the same matter that was the nebula flies into the monogram, or breaks into digits
  if(m>.01||dgt>.01){
    const e=ease(Math.min(1,m));
    for(const b of bits){
      b.a+=b.s*.01;const hx=Math.cos(b.a)*b.r*1.3,hy=Math.sin(b.a)*b.r*.9;
      if(m>.01){const k=Math.max(0,Math.min(1,(m-b.dl*.35)/.65)),ke=ease(k);
        const x=px+hx*(1-ke)+b.tx*ke+Math.sin(t*3+b.dl*9)*(1-ke)*3,y=py+hy*(1-ke)+b.ty*ke+Math.cos(t*2.6+b.dl*9)*(1-ke)*3;
        const col=ke>.9?(b.tx<-10?'143,227,255':b.tx<40?'143,227,255':'32,231,170'):b.c;
        glow(x,y,2+b.z*2.4*ke,col,.55*k);g.fillStyle=`rgba(${ke>.9?col:'255,255,255'},${.9*k})`;g.beginPath();g.arc(x,y,.9+b.z*.55*ke,0,6.283);g.fill()}
      if(dgt>.01&&b.dl<.55){if(Math.random()<.02)b.ch=Math.random()<.5?'0':'1';const al=dgt*(.35+.5*Math.abs(Math.sin(t*2+b.dl*20)));
        g.font='10px ui-monospace,Consolas,monospace';g.textAlign='center';g.fillStyle=`rgba(${b.c==='255,255,255'?'143,227,255':b.c},${al})`;g.fillText(b.ch,px+hx*1.15,py+hy*1.05)}
    }
  }
  if(Math.random()<.5*solid){const a=Math.random()*6.28,rr=40+Math.random()*40;dust.push({x:px+Math.cos(a)*rr*1.1,y:py+Math.sin(a)*rr*.85,vx:Math.cos(a)*.3+vx*.2,vy:Math.sin(a)*.3-.15,l:1,s:.8+Math.random()*1.3})}
  for(let i=dust.length-1;i>=0;i--){const d=dust[i];d.x+=d.vx;d.y+=d.vy;d.l-=.013;if(d.l<=0){dust.splice(i,1);continue}glow(d.x,d.y,d.s*4,O.cols[i%3],d.l*.5);g.fillStyle=`rgba(255,255,255,${d.l})`;g.beginPath();g.arc(d.x,d.y,d.s*.7,0,6.283);g.fill()}
  g.globalCompositeOperation='source-over';
  // 5) the eyes (they stay open while she is binary, and rest while she is the monogram)
  face.setAttribute('transform',`translate(${(px+ex).toFixed(1)},${(py+ey-2).toFixed(1)}) rotate(${(cur.tilt*gxn*.9).toFixed(1)}) scale(${breath.toFixed(3)})`);
  face.setAttribute('opacity',(1-m*.97).toFixed(2));
  blinkT-=.016;if(blinkT<0)blinkT=2.4+Math.random()*3.2;const bl=blinkT<.13?.06:1;
  const pulse=1+(S.look===2?Math.sin(t*5)*.18:0);
  for(const [n,x] of [['.eL',-21],['.eR',21]]){
    const e=q(n),a=Math.abs(cur.arc);
    e.setAttribute('transform',`translate(${x},0) scale(${cur.sx.toFixed(3)},${(cur.sy*bl).toFixed(3)})`);
    e.querySelector('.open').setAttribute('opacity',(1-a).toFixed(2));
    const arc=e.querySelector('.arc');arc.setAttribute('opacity',a.toFixed(2));arc.setAttribute('transform',`scale(1,${cur.arc>=0?1:-1}) translate(0,${cur.arc>=0?0:-1})`);
    e.querySelector('.h').setAttribute('opacity',Math.min(1,cur.glow*pulse+(S.look===1?.05:0)).toFixed(2));
  }
  requestAnimationFrame(frame);
}
frame();
</script>
